[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hillcare-geoengine"
version = "1.1.0"
description = "Slope-adjusted (Tobler) walking-time access analysis and facility siting engine for hilly regions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
]
real-data = [
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "tifffile>=2024.2.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
